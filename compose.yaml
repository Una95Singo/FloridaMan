services:
  app:
    build: .
    environment:
      FM_DEMO: "false"
      DATABASE_URL: postgresql+psycopg://floridaman:${DB_PASSWORD:?Set DB_PASSWORD}@db/floridaman
      SESSION_SECRET: ${SESSION_SECRET:?Set a long random SESSION_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set the HTTPS Keycloak realm issuer}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-floridaman}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      FORWARDED_ALLOW_IPS: ${PROXY_IP:?Set the trusted reverse-proxy IP}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: floridaman
      POSTGRES_USER: floridaman
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floridaman"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      FM_DOMAIN: ${FM_DOMAIN:?Set the independent FloridaMan domain}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [app]
    restart: unless-stopped
volumes:
  database:
  caddy_data:
  caddy_config:
