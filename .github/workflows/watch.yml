# Replaces the broken pipeline/ job and public draft issue publication.
# The heartbeat only probes source availability. It never executes a model.
name: Source availability heartbeat
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check NHC feed availability
        run: |
          python3 - <<'PYCODE'
          import urllib.request, xml.etree.ElementTree as ET
          request = urllib.request.Request('https://www.nhc.noaa.gov/index-at.xml', headers={'User-Agent':'FloridaMan-source-health/2.1'})
          with urllib.request.urlopen(request, timeout=30) as response:
              ET.fromstring(response.read())
          print('NHC feed available. No analytical run or public draft was created.')
          PYCODE
