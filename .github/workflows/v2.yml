name: V2 workflow checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests
      - run: python -m pytest tests/v2 -q
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm install --prefix /tmp/browser-check playwright@1.56.1
      - run: /tmp/browser-check/node_modules/.bin/playwright install --with-deps chromium
      - run: ./scripts/check-browser.sh
        env:
          PLAYWRIGHT_MODULE: /tmp/browser-check/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-browser-evidence
          path: test-evidence/
